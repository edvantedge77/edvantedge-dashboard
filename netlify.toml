[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[functions."dialpad-proxy"]
  timeout = 26

[functions."score-transcript"]
  timeout = 26

[functions."process-quality-queue"]
  timeout = 26
  # Auto-fetch schedule removed: agents now click "Fetch" in Quality manually.

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
